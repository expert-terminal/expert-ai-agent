name: Publish macOS release downloads

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful workflow run containing the macos-builds artifact
        required: true
        default: '39267434488'
      release_tag:
        description: GitHub release tag
        required: true
        default: v0.1.5
      target_commitish:
        description: Commit used to build the DMGs
        required: true
        default: 122d5dd0166969456bf4dde6dad3c6df9eeafeac

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified macOS build artifact from Actions
        uses: actions/download-artifact@v4
        with:
          name: macos-builds
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Verify release files and print checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.dmg)
          test "${#files[@]}" -eq 2
          ls -lh "${files[@]}"
          shasum -a 256 "${files[@]}"
          printf '%s\n' "${files[@]}" | grep -q -- '-x64\.dmg$'
          printf '%s\n' "${files[@]}" | grep -q -- '-arm64\.dmg$'

      - name: Publish prerelease with direct DMG downloads
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.dmg
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.target_commitish }}
          name: Expert AI Agent ${{ inputs.release_tag }} for macOS
          body: |
            macOS test builds for Intel (x64) and Apple Silicon (arm64).

            The DMGs include the local agent runtime; Node.js does not need to be installed separately. These builds are unsigned and not notarized. macOS may require right-clicking the app and choosing Open on first launch.
          draft: false
          prerelease: true
          generate_release_notes: false
