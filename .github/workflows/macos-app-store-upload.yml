name: Upload Mac App Store build to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Actions run ID that produced the signed Mac App Store package
        required: true
        type: string

permissions:
  actions: read

jobs:
  upload:
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Download signed Mac App Store package
        uses: actions/download-artifact@v4
        with:
          name: ExpertAI-Agent-Mac-App-Store-signed
          path: release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          unset APP_STORE_CONNECT_PRIVATE_KEY
          PKG=$(find release -maxdepth 1 -type f -name '*.pkg' -print -quit)
          test -n "$PKG"
          test -s "$PKG.sha256"
          (cd release && shasum -a 256 -c "$(basename "$PKG").sha256")

      - name: Upload package to App Store Connect for TestFlight processing
        run: >-
          xcrun altool --upload-app
          --file "$(find release -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          --type macos
          --apiKey "$APP_STORE_CONNECT_KEY_ID"
          --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          --output-format json
