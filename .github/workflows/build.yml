name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-store-appx:
    runs-on: windows-latest
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Enable long paths for bundled runtime
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci
      - run: node scripts/setup-binaries.js

      - name: Build Microsoft Store package
        shell: pwsh
        run: |
          subst W: $env:GITHUB_WORKSPACE
          Set-Location W:\
          node scripts/build-store-package.js

      - name: Verify package output
        shell: pwsh
        run: |
          $packages = Get-ChildItem -LiteralPath dist/store -Filter '*.appx' -File
          if (-not $packages) { throw 'No AppX package was produced.' }
          $packages | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: expert-ai-agent-store-appx
          path: dist/store/*.appx
          if-no-files-found: error
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This repository's phone backend is a private submodule in ssv-asia.
          # Add a read-only PAT as EXPERT_AI_PHONE_TOKEN in repository Actions secrets.
          token: ${{ secrets.EXPERT_AI_PHONE_TOKEN || github.token }}

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive --depth 1 vendor/expert-ai-phone

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/expert-ai-phone/backend -> target

      - name: Build pi-server for macOS
        run: |
          cd vendor/expert-ai-phone/backend
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/pi-server ../../../resources/
          cp target/x86_64-apple-darwin/release/pi-server ../../../resources/pi-server-x64
        continue-on-error: false

      - name: Bundle a universal macOS Node into the pi engine
        # resources/pi-node/ ships only the Windows node.exe in git. The macOS
        # dmgs need a native `node` for Agent-mode chat (the `pi` launcher execs
        # "$basedir/node"). electron-builder packs the same resources/ into BOTH
        # the arm64 and x64 dmgs, so a single file must run on both arches ->
        # lipo the two official Node builds into one universal binary.
        run: |
          set -euo pipefail
          NODE_VERSION=v22.19.0
          for arch in arm64 x64; do
            curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-${arch}.tar.gz" -o "node-${arch}.tar.gz"
            tar -xzf "node-${arch}.tar.gz"
          done
          lipo -create \
            "node-${NODE_VERSION}-darwin-arm64/bin/node" \
            "node-${NODE_VERSION}-darwin-x64/bin/node" \
            -output resources/pi-node/node
          chmod +x resources/pi-node/node resources/pi-node/pi resources/pi-server resources/pi-server-x64
          file resources/pi-node/node
          "resources/pi-node/node" --version
          lipo resources/pi-node/node -verify_arch arm64
          lipo resources/pi-node/node -verify_arch x86_64
          lipo resources/pi-server -verify_arch arm64
          lipo resources/pi-server-x64 -verify_arch x86_64
          test -x resources/pi-node/pi
          test -x resources/pi-server
          test -x resources/pi-server-x64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'

      - name: Keep only macOS runtime binaries in the DMGs
        run: |
          rm -f resources/pi-server.exe resources/pi-node/node.exe resources/pi-node/pi.cmd resources/pi-node/pi.ps1

      - name: Build for macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify both standalone DMGs
        run: |
          set -euo pipefail
          ls -lh dist/Expert*.dmg
          test -n "$(find dist -maxdepth 1 -name '*-arm64.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-x64.dmg' -print -quit)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: dist/Expert*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths for bundled runtime
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'

      - name: Build for Windows
        shell: pwsh
        run: |
          # The bundled Pi SDK includes a few deep Mistral SDK paths that exceed
          # the classic Windows path limit from the normal Actions workspace.
          subst W: $env:GITHUB_WORKSPACE
          Set-Location W:\
          npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Expert*.exe

  release:
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-builds
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
