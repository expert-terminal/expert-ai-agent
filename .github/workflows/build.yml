name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive --depth 1 vendor/expert-ai-phone

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build pi-server for macOS
        run: |
          cd vendor/expert-ai-phone/backend
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/pi-server ../../../resources/
          cp target/x86_64-apple-darwin/release/pi-server ../../../resources/pi-server-x64
        continue-on-error: false

      - name: Bundle a universal macOS Node into the pi engine
        # resources/pi-node/ ships only the Windows node.exe in git. The macOS
        # dmgs need a native `node` for Agent-mode chat (the `pi` launcher execs
        # "$basedir/node"). electron-builder packs the same resources/ into BOTH
        # the arm64 and x64 dmgs, so a single file must run on both arches ->
        # lipo the two official Node builds into one universal binary.
        run: |
          set -euo pipefail
          NODE_VERSION=v22.19.0
          for arch in arm64 x64; do
            curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-${arch}.tar.gz" -o "node-${arch}.tar.gz"
            tar -xzf "node-${arch}.tar.gz"
          done
          lipo -create \
            "node-${NODE_VERSION}-darwin-arm64/bin/node" \
            "node-${NODE_VERSION}-darwin-x64/bin/node" \
            -output resources/pi-node/node
          chmod +x resources/pi-node/node
          file resources/pi-node/node
          "resources/pi-node/node" --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build for macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: dist/Expert*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build for Windows
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Expert*.exe

  release:
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-builds
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
